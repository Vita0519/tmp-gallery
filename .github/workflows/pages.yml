name: pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "7 * * * *" # 每小时同步一次门户
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium

      # 封面增量缓存：每次存新 key，恢复时取最近一份
      - uses: actions/cache@v4
        with:
          path: covers
          key: covers-v2-${{ github.run_id }}
          restore-keys: covers-v2-

      - run: node scripts/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
