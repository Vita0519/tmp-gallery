<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gallery · Vita</title>
<style>
  :root{--bg:#0b0d10;--surface:#14171d;--surface-2:#1a1e25;--ink:#e8eaf0;--ink-2:#a1a5aa;--ink-3:#757a7e;--line:rgba(255,255,255,.07);--brand:#2dd4bf;--ease:cubic-bezier(.2,.8,.2,1)}
  @media (prefers-color-scheme:light){:root{--bg:#f6f7f5;--surface:#fff;--surface-2:#eef0ec;--ink:#16181b;--ink-2:#4e5458;--ink-3:#80868a;--line:rgba(0,0,0,.08);--brand:#0f766e}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif}
  header{max-width:1280px;margin:0 auto;padding:64px 24px 28px;display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
  h1{margin:0;font-size:clamp(32px,6vw,64px);letter-spacing:-.03em;font-weight:700}
  header small{color:var(--ink-3);font-variant-numeric:tabular-nums}
  main{max-width:1280px;margin:0 auto;padding:0 24px 64px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
  .tile{position:relative;aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:var(--surface) center/cover no-repeat;border:1px solid var(--line);color:var(--ink);text-decoration:none;display:flex;flex-direction:column;justify-content:space-between;padding:16px;transition:transform .35s var(--ease),border-color .35s var(--ease)}
  .tile:not(.has-cover){background-image:radial-gradient(120% 90% at 100% 0%,color-mix(in srgb,var(--brand) 22%,transparent),transparent 60%)}
  .tile.has-cover::before{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.72),transparent 55%);transition:opacity .35s var(--ease)}
  .tile.has-cover{color:#fff}
  .tile>*{position:relative}
  .tile:hover{transform:translateY(-3px);border-color:var(--brand)}
  .tile.has-cover:hover::before{opacity:.55}
  .num{font:600 13px/1 ui-monospace,Consolas,monospace;opacity:.7}
  .meta{display:flex;flex-direction:column;gap:4px}
  .meta b{font-size:20px;letter-spacing:-.01em}
  .meta em{font-style:normal;font-size:13px;opacity:.75;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .meta i{font-style:normal;display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .meta i span{font-size:11px;padding:2px 8px;border-radius:99px;background:rgba(127,127,127,.22)}
  .empty{grid-column:1/-1;color:var(--ink-3);padding:48px 0;text-align:center}
  footer{max-width:1280px;margin:0 auto;padding:0 24px 40px;color:var(--ink-3);font-size:13px}
  footer a{color:var(--ink-2)}
</style>
</head>
<body>
<header><h1>Gallery</h1><small><!--COUNT--> works</small></header>
<main>
<!--TILES-->
</main>
<footer>数据来自 <a href="<!--SITE-->/portal">临时预览站门户</a> · 项目到期后自动下架 · 更新于 <!--UPDATED--> · <a href="https://github.com/Vita0519/tmp-gallery">github</a></footer>
</body>
</html>
